name: "Test Dockerfile structure"
on:
  push:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
jobs:
  tests:
    # Test every image natively on both architectures.
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        runner: ['ubuntu-latest', 'ubuntu-24.04-arm']
        drupal_version: ['10.5', '10.6', '11.2', '11.3', '11.4', '11.5']
        include:
          - drupal_version: '10.5'
            drupal_major: '10'
          - drupal_version: '10.6'
            drupal_major: '10'
          - drupal_version: '11.2'
            drupal_major: '11'
          - drupal_version: '11.3'
            drupal_major: '11'
          - drupal_version: '11.4'
            drupal_major: '11'
          - drupal_version: '11.5'
            drupal_major: '11'
    steps:
      - name: checkout source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install Google Container Structure Test Framework
        run: |
          CST_BIN="container-structure-test-linux-$(dpkg --print-architecture)"
          curl -LO "https://storage.googleapis.com/container-structure-test/latest/${CST_BIN}"
          chmod +x "${CST_BIN}"
          sudo mv "${CST_BIN}" /usr/local/bin/container-structure-test
      - name: Build docker images
        run: make
        working-directory: ${{ matrix.drupal_major }}/${{ matrix.drupal_version }}
      - name: Run tests
        run: make test
        working-directory: ${{ matrix.drupal_major }}/${{ matrix.drupal_version }}

  publish:
    runs-on: ubuntu-latest
    needs: [ tests ]
    if: github.event_name == 'workflow_dispatch' || contains('refs/heads/master', github.ref)
    strategy:
      matrix:
        drupal_version: ['10.5', '10.6', '11.2', '11.3', '11.4', '11.5']
        include:
          - drupal_version: '10.5'
            drupal_major: '10'
          - drupal_version: '10.6'
            drupal_major: '10'
          - drupal_version: '11.2'
            drupal_major: '11'
          - drupal_version: '11.3'
            drupal_major: '11'
          - drupal_version: '11.4'
            drupal_major: '11'
          - drupal_version: '11.5'
            drupal_major: '11'
    steps:
      - name: checkout source
        uses: actions/checkout@v4
      # QEMU lets the amd64 runner build the linux/arm64 variant.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push multi-arch images (linux/amd64, linux/arm64) to DockerHub
        run: make release
        working-directory: ${{ matrix.drupal_major }}/${{ matrix.drupal_version }}
